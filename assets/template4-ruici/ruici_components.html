</section>

<!-- ===== RuiciRichParagraph：正文每段建议 3–4 行 ===== -->
<p style="margin:0 0 18px;color:#3e3e3e;font-size:17px;line-height:2;letter-spacing:.034em;text-align:justify;">正文一段只表达一个意思。建议控制在手机端约 3–4 行，超过 80–100 个中文字符或存在多个并列观点时拆段。</p>

<!-- ===== HighRiskReferralCard：只有源文有预约事实时使用 ===== -->
<section style="margin:28px 20px 24px;">
  <!-- 问题标签 -->
  <section style="display:inline-block;position:relative;z-index:1;margin:0 0 -9px 12px;padding:8px 16px;background:rgba(171,212,191,.3);border:2px solid #3a7945;border-radius:14px;box-shadow:5px 5px 0 #ecf9ff, inset 0 0 0 2px #fff;">

  </section>

    <p style="margin:0 0 12px;color:#c73e3e;font-size:17px;font-weight:700;line-height:1.8;text-align:justify;">只需一步：预约挂号</p>

    <section style="margin:0 auto 16px;width:32%;min-width:116px;border:1px solid #3a7945;padding:6px;line-height:0;text-align:center;">
      <img src="__ASSET_BASE_URL__/ruici/qr-code.png" alt="扫码预约" style="width:100%;height:auto;display:block;">
    </section>
    <p style="margin:0 0 6px;color:#3a7945;font-size:17px;font-weight:700;line-height:1.8;">门诊信息</p>

    <p style="margin:0;color:#3e3e3e;font-size:17px;line-height:2;">请替换为真实联系电话</p>
  </section>
</section>
