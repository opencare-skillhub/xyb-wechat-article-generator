<!-- 瑞慈高保真组件库 v2.0：全部 inline style / section 标签 -->

<!-- ===== RuiciVisualPanel：连续图文叙事面板；可重复 1–6 次 ===== -->
<section style="margin:0 0 10px;text-align:center;line-height:0;">
  <img src="__ASSET_BASE_URL__/ruici/visual-panel-01.png" alt="研究视觉叙事图" style="width:100%;height:auto;display:block;max-width:100%;">
</section>

<!-- ===== RuiciSectionHeading：用于文本章节，非每段重复使用 ===== -->
<section style="margin:28px 0 15px;">
  <p style="margin:0;color:#3a7945;font-size:18px;line-height:1.7;font-weight:700;">章节标题</p>
</section>

<!-- ===== RuiciRichParagraph：17px / line-height 2 / 3–4行 ===== -->
<p style="margin:0 0 18px;color:#3e3e3e;font-size:17px;line-height:2;letter-spacing:.034em;text-align:justify;">正文一段只表达一个意思。建议控制在手机端约 3–4 行，超过 80–100 个中文字符或出现多个并列观点时拆段。</p>

<!-- ===== HighRiskReferralCard：仅提供真实预约/地址/时间/电话/QR 时使用 ===== -->
<section style="margin:26px 0 24px;">
  <!-- 上层问题标签 -->
  <section style="display:inline-block;width:100%;border-radius:14px;overflow:hidden;background:rgba(171,212,191,.3);padding:5px 15px 0;border:2px solid #3a7945;box-shadow:5px 5px 0 #ecf9ff,inset 0 0 0 2px #fff;box-sizing:border-box;">
    <section style="display:flex;align-items:center;margin:0 0 3px;padding-left:8px;">
      <p style="margin:0;color:#3a7945;font-size:18px;line-height:1.6;font-weight:700;">体检高危人群如何转诊？</p>
    </section>
  </section>
  <!-- 显式 CSS 尾角 -->
  <section style="width:0;height:0;margin:0 0 0 31px;border-style:solid;border-width:10px 7px 0;border-color:#3a7945 transparent transparent;box-sizing:border-box;"></section>
  <!-- 下层信息主体 -->
  <section style="margin-top:-2px;border-radius:15px;overflow:hidden;background:rgba(171,212,191,.3);padding:19px;border:2px solid #3a7945;box-shadow:5px 5px 0 #ecf9ff,inset 0 0 0 2px #fff;box-sizing:border-box;">
    <p style="margin:0 0 12px;color:#c73e3e;font-size:17px;font-weight:700;line-height:2;text-align:justify;">只需一步：预约挂号</p>
    <p style="margin:0 0 12px;color:#3e3e3e;font-size:17px;line-height:2;text-align:justify;">请替换为经过确认的预约说明。</p>
    <!-- QR 核心位：28% 宽度 + 对称箭头 -->
    <section style="display:flex;align-items:center;justify-content:center;margin:12px 0 18px;">
      <section style="width:0;height:0;border-style:solid;border-width:5px 8px 5px 0;border-color:transparent #3a7945 transparent transparent;"></section>
      <section style="width:28%;min-width:108px;margin:0 12px;border:1px solid #3a7945;padding:5px;line-height:0;box-sizing:border-box;">
        <img src="__ASSET_BASE_URL__/ruici/qr-code.png" alt="扫码预约" style="width:100%;height:auto;display:block;">
      </section>
      <section style="width:0;height:0;border-style:solid;border-width:5px 0 5px 8px;border-color:transparent transparent transparent #3a7945;"></section>
    </section>
    <p style="margin:0;color:#3a7945;font-size:17px;line-height:2;font-weight:700;">门诊信息</p>
    <p style="margin:0;color:#3e3e3e;font-size:17px;line-height:2;text-align:justify;"><strong>地址：</strong>请替换为真实地址<br><strong>时间：</strong>请替换为真实时间<br><strong>检查：</strong>请替换为真实服务形式</p>
    <p style="margin:14px 0 0;color:#3a7945;font-size:17px;line-height:2;font-weight:700;">咨询电话</p>
    <p style="margin:0;color:#3e3e3e;font-size:17px;line-height:2;">请替换为真实联系电话</p>
  </section>
</section>

<!-- ===== RuiciDivider：原稿浅蓝圆点 + 中央图标结构 ===== -->
<section style="display:flex;justify-content:center;align-items:center;margin:10px 0;">
  <section style="width:14px;height:14px;border-radius:16px;background:#c7e1f7;"></section>
  <section style="padding:0 10px;line-height:0;">
    <img src="__ASSET_BASE_URL__/ruici/divider-icon.png" alt="" style="width:30px;height:auto;display:block;">
  </section>
  <section style="width:14px;height:14px;border-radius:16px;background:#c7e1f7;"></section>
</section>

  <section style="width:100%;padding:0 10px;border:1px dashed #90d7ec;box-sizing:border-box;">
    <section style="border-left:10px solid #90d7ec;padding:0 0 12px;box-sizing:border-box;">
      <section style="margin:0 0 14px;border-top:1px solid #000;position:relative;">
        <section style="position:absolute;right:-4px;top:-4px;width:6px;height:6px;border-radius:50%;background:#80b3ff;"></section>
      </section>
      <section style="display:inline-block;margin:-1em 0 12px;padding:3px 10px;background:#fff;">
        <p style="margin:0;color:#114287;font-size:16px;line-height:1.7;font-weight:700;">往期回顾</p>
      </section>
      <section style="padding:0 10px;">
        <p style="margin:0 0 10px;font-size:15px;line-height:1.8;"><a href="https://example.com" style="color:#607fa6;text-decoration:none;">相关文章标题一</a></p>
        <p style="margin:0;font-size:15px;line-height:1.8;"><a href="https://example.com" style="color:#607fa6;text-decoration:none;">相关文章标题二</a></p>
      </section>
    </section>
  </section>
</section>
