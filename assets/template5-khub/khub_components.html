<!-- Khub 高保真组件库 v1.0：病历记录风格 + 全部 inline style / section 标签 -->

<!-- ===== KhubSectionCard：内容卡片（白底 + 粗黑边框 + 圆角） ===== -->
<section style="margin:0 0 16px;background-color:#fffdf8;border:2px solid #151515;border-radius:8px;padding:22px 18px 24px;">
  __CARD_CONTENT__
</section>

<!-- ===== KhubSectionHeader：章节标题（编号 + 粗黑底线 + 绿色 H2） ===== -->
<table style="width:100%;border-bottom:2px solid #151515;padding-bottom:10px;margin-bottom:12px;">
  <tbody>
    <tr>
      <td style="vertical-align:top;">
        <p style="margin:0;font-family:'PingFang SC','Microsoft YaHei',sans-serif;font-size:13px;color:#5b5a54;letter-spacing:1px;">__SECTION_NUM__ — __SECTION_CATEGORY__</p>
        <h2 style="margin:4px 0 0;font-family:'Georgia','Songti SC',STSong,serif;font-size:23px;font-weight:900;line-height:1.3;color:#0b5e45;">__SECTION_TITLE__</h2>
      </td>
      <td align="right" style="vertical-align:top;width:52px;">
        <p style="margin:0;font-family:'Georgia','Songti SC',STSong,serif;font-size:18px;font-weight:900;color:#151515;">__SECTION_NUM__</p>
      </td>
    </tr>
  </tbody>
</table>

<!-- ===== KhubBodyParagraph：正文段落（15px / line-height 1.8） ===== -->
<p style="margin:10px 0;font-family:'PingFang SC','Microsoft YaHei',sans-serif;font-size:15px;line-height:1.8;color:#151515;">__PARAGRAPH__</p>

<!-- ===== KhubStrongGreen：绿色强调文字 ===== -->
<strong style="color:#0b5e45;">__EMPHASIS__</strong>

<!-- ===== KhubStrongRed：红色强调文字（疾病名/警示） ===== -->
<strong style="color:#c94b3f;">__DISEASE_EMPHASIS__</strong>

<!-- ===== KhubBlockquote：黄色左边框引用块 ===== -->
<blockquote style="margin:16px 0;border-left:5px solid #f7c90d;background-color:#faf7ef;padding:12px 14px;font-family:'PingFang SC','Microsoft YaHei',sans-serif;font-size:15px;line-height:1.8;color:#151515;">
  __QUOTE__
</blockquote>

<!-- ===== KhubDataTable：双列数据对比表（粗黑边框 + 米色底） ===== -->
<table style="width:100%;margin:14px 0 6px;">
  <tbody>
    <tr>
      <td style="border:2px solid #151515;background-color:#faf7ef;padding:14px 10px;text-align:center;width:49%;">
        <p style="margin:0;font-family:'Georgia','Songti SC',STSong,serif;font-size:20px;font-weight:900;color:#151515;">__DATA_LEFT_NUM__</p>
        <p style="margin:4px 0 0;font-family:'PingFang SC','Microsoft YaHei',sans-serif;font-size:13px;line-height:1.6;color:#151515;">__DATA_LEFT_LABEL__</p>
      </td>
      <td style="padding:0;font-size:0;line-height:0;width:2%;"></td>
      <td style="border:2px solid #151515;background-color:#faf7ef;padding:14px 10px;text-align:center;width:49%;">
        <p style="margin:0;font-family:'Georgia','Songti SC',STSong,serif;font-size:20px;font-weight:900;color:#151515;">__DATA_RIGHT_NUM__</p>
        <p style="margin:4px 0 0;font-family:'PingFang SC','Microsoft YaHei',sans-serif;font-size:13px;line-height:1.6;color:#151515;">__DATA_RIGHT_LABEL__</p>
      </td>
    </tr>
  </tbody>
</table>

<!-- ===== KhubHeaderDataRow：头部数据行（白底半透明边框） ===== -->
<table style="width:100%;margin:16px 0 0;">
  <tbody>
    <tr>
      <td style="border:1px solid rgba(255,255,255,0.28);padding:10px 8px;text-align:center;width:50%;">
        <p style="margin:0;font-family:'Georgia','Songti SC',STSong,serif;font-size:22px;font-weight:900;color:#fffdf8;">__HD_NUM_1__</p>
        <p style="margin:4px 0 0;font-family:'PingFang SC','Microsoft YaHei',sans-serif;font-size:13px;color:rgba(255,255,255,0.8);">__HD_LABEL_1__</p>
      </td>
      <td style="border:1px solid rgba(255,255,255,0.28);padding:10px 8px;text-align:center;width:50%;">
        <p style="margin:0;font-family:'Georgia','Songti SC',STSong,serif;font-size:22px;font-weight:900;color:#fffdf8;">__HD_NUM_2__</p>
        <p style="margin:4px 0 0;font-family:'PingFang SC','Microsoft YaHei',sans-serif;font-size:13px;color:rgba(255,255,255,0.8);">__HD_LABEL_2__</p>
      </td>
    </tr>
  </tbody>
</table>

<!-- ===== KhubColorBar：底部四色条 ===== -->
<table style="width:100%;margin:0;">
  <tbody>
    <tr>
      <td style="height:6px;font-size:0;line-height:0;background-color:#0b5e45;width:40%;"></td>
      <td style="height:6px;font-size:0;line-height:0;background-color:#f7c90d;width:22%;"></td>
      <td style="height:6px;font-size:0;line-height:0;background-color:#c94b3f;width:16%;"></td>
      <td style="height:6px;font-size:0;line-height:0;background-color:#3d7daa;width:22%;"></td>
    </tr>
  </tbody>
</table>

<!-- ===== KhubImageFrame：图片容器（居中、全宽） ===== -->
<table style="width:100%;margin:14px 0 6px;">
  <tbody>
    <tr>
      <td align="center" style="padding:0;">
        <img src="__IMG_SRC__" alt="__IMG_ALT__" style="width:100%;height:auto;display:block;max-width:100%;">
      </td>
    </tr>
  </tbody>
</table>
